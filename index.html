<head>

<meta name="description" content="Aprende taekwondo WT de cinturón blanco a negro: poomsae animados, patadas, vocabulario y exámenes.">
<meta name="theme-color" content="#0b47a0">
<meta property="og:title" content="Taegeuk Dojang">
<meta property="og:description" content="Poomsae animados, patadas y vocabulario de taekwondo, de blanco a negro.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%230b47a0'/%3E%3Cpath d='M50 2a48 48 0 0 1 0 96a24 24 0 0 1 0-48a24 24 0 0 0 0-48z' fill='%23c8102e' transform='rotate(-35 50 50)'/%3E%3C/svg%3E">
<style>html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Taegeuk Dojang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: dojang floor — a quiet paper surface, ink figure, Taeguk red/blue only where it counts (state, kihap, exam). */
:root{
  --bg:#eceee9; --surface:#fafbf8; --surface-2:#f2f4ef; --ink:#15181a; --muted:#5b625e; --line:#d5dad3;
  --red:#c8102e; --blue:#0b47a0; --ok:#1d7f47; --okbg:#e2f1e7; --badbg:#f8e1e4; --figfar:#a4aba6;
  --display:"Black Han Sans","Arial Black",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --surface:#1a1d20; --surface-2:#22262a; --ink:#ebeeea; --muted:#9aa29d; --line:#2e3337;
  --red:#ff4f61; --blue:#6f9bff; --ok:#4cc77f; --okbg:#173325; --badbg:#3a1a1f; --figfar:#5d6560; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1a1d20; --surface-2:#22262a; --ink:#ebeeea; --muted:#9aa29d; --line:#2e3337;
  --red:#ff4f61; --blue:#6f9bff; --ok:#4cc77f; --okbg:#173325; --badbg:#3a1a1f; --figfar:#5d6560; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1080px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.step:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ko{font-family:var(--display);letter-spacing:.01em}
.muted{color:var(--muted)}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand b{font-family:var(--display);font-weight:400;font-size:22px}
.mini-belt{display:flex;align-items:center;gap:8px;font-size:13px}
/* belts */
.belt{position:relative;height:16px;border-radius:3px;width:100%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);overflow:hidden}
.belt i{position:absolute;top:0;bottom:0;width:12%}
.belt.big{height:30px;border-radius:4px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* hero */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center;margin-bottom:36px}
.hero h1{font-size:clamp(40px,7vw,72px)}
.hero .gup{font-family:var(--mono);font-size:14px;color:var(--muted);margin:6px 0 18px}
.hero p{max-width:52ch;margin:16px 0 20px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden}
.stage canvas{display:block;width:100%;height:280px}
.stage .cap{position:absolute;left:14px;top:12px;right:14px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.stage .cap .ko{font-size:20px}
/* ladder */
.ladder{display:grid;gap:8px}
.rung{display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;width:100%}
.rung:hover:not(:disabled){border-color:var(--ink)}
.rung:disabled{cursor:default;opacity:.55}
.rung .nm{font-weight:700}
.rung .sub{font-size:13px;color:var(--muted)}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.chip.now{background:var(--red);color:#fff;border-color:transparent}
section+section{margin-top:36px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-h h2{font-size:28px}
/* level */
.back{background:none;border:0;padding:0;color:var(--muted);font-size:14px;margin-bottom:10px}
.back:hover{color:var(--ink)}
.lvl-h{display:flex;justify-content:space-between;gap:20px;align-items:end;flex-wrap:wrap;margin-bottom:18px}
.lvl-h h1{font-size:clamp(30px,5vw,48px)}
.path{display:flex;align-items:center;gap:10px;min-width:240px;flex:0 1 320px}
.path .belt{flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.formpick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.player{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}
.player .stage canvas{height:300px}
.views{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.compass{position:absolute;right:12px;bottom:12px;width:74px;height:74px}
.stepinfo{padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.stepinfo .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.stepinfo .st{font-size:13px;color:var(--muted);margin-top:4px}
.tech{display:flex;gap:10px;align-items:baseline;margin-top:8px;flex-wrap:wrap}
.tech .ko{font-size:22px}
.side{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.side::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.side.R{color:var(--red)} .side.L{color:var(--blue)}
.legend{display:flex;gap:12px}
.tris{display:flex;flex-wrap:wrap;gap:8px}
.tri{display:flex;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13.5px}
.sym{font-size:34px;line-height:1;color:var(--ink)}
.symbig{font-size:52px;line-height:1;margin:6px 0}
.symsm{float:right;font-size:24px;line-height:1;margin-left:8px}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.viewbar{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.vb{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.vb[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.figopt.opt{position:relative;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;text-align:left}
.figopt:hover:not(:disabled){border-color:var(--ink)}
.figopt canvas{display:block;width:100%;height:190px}
.figopt .lt{position:absolute;left:10px;top:8px;font-family:var(--display);font-size:20px;color:var(--muted)}
.figopt .nm{display:block;padding:8px 12px;font-size:13px;border-top:1px solid var(--line);min-height:38px}
.figopt.right{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.figopt.wrong{border-color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.figopt:disabled{cursor:default}
.ref canvas{height:220px}
.kihap{display:inline-block;background:var(--red);color:#fff;font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:4px;letter-spacing:.08em}
.controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.ic{width:40px;height:40px;border-radius:6px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;font-size:15px}
.ic:hover{border-color:var(--ink)}
.steps{list-style:none;padding:0;margin:12px 0 0;max-height:330px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.step{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px}
.step:last-child{border-bottom:0}
.step .i{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.step[aria-current="true"]{background:var(--surface-2);font-weight:600}
.step[aria-current="true"] .i{color:var(--red)}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--blue);padding:8px 12px;background:var(--surface);border-radius:0 6px 6px 0;margin-top:14px;max-width:80ch}
.kicks{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
.klist{display:grid;gap:6px}
.kbtn{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
.kbtn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--red)}
.kbtn .ko{font-size:18px}
.kbtn small{grid-column:1/-1;color:var(--muted)}
.kdetail{margin-top:12px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.kdetail dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0 0;font-size:14px}
.kdetail dt{color:var(--muted)}
.kdetail dd{margin:0}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.term{padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.term .ko{font-size:19px;display:block}
.term span{font-size:13.5px;color:var(--muted)}
.exambox{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 20px}
.part{padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.part b{display:block;font-size:15px;margin:4px 0}
.part span{font-size:13px;color:var(--muted)}
/* exam */
.exam-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--red);transition:width .3s}
.q{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.q.wide{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.q.solo{grid-template-columns:minmax(0,640px)}
.prompt{font-family:var(--display);font-size:clamp(26px,4vw,40px);line-height:1.1;margin:6px 0 4px}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;padding:13px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:15px;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ink)}
.opt.wrong{background:var(--badbg);border-color:var(--red)}
.opt:disabled{cursor:default}
.opt .ko{font-size:17px}
.trail{display:flex;flex-wrap:wrap;gap:4px;margin-top:14px}
.trail span{font-family:var(--mono);font-size:11px;width:26px;height:22px;display:grid;place-items:center;border-radius:4px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.trail span.ok{background:var(--okbg);color:var(--ok)}
.trail span.bad{background:var(--badbg);color:var(--red)}
.trail span.cur{outline:2px solid var(--ink)}
.result{max-width:720px}
.result h1{font-size:clamp(36px,6vw,60px);margin:6px 0 10px}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0}
.score{padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.score b{font-family:var(--display);font-weight:400;font-size:30px;display:block;font-variant-numeric:tabular-nums}
.miss{font-size:14px;margin:6px 0 0;padding-left:18px}
.miss li{margin:4px 0}
.award{margin:16px 0;height:34px}
.award .belt{height:34px;transform-origin:left;animation:tie 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes tie{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.foot{margin-top:40px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.linkish{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted);font-size:12.5px}
.confirm{display:inline-flex;gap:8px;align-items:center}
@media (max-width:760px){
  .hero,.player,.kicks,.q,.q.wide{grid-template-columns:1fr}
  .ref canvas{height:150px}
  .figopt canvas{height:160px}
  .rung{grid-template-columns:90px 1fr;}
  .rung .chip{grid-column:2;justify-self:start}
  .exambox,.scores{grid-template-columns:1fr}
  .stage canvas,.player .stage canvas{height:250px}
  .views{grid-template-columns:1fr 1fr;gap:8px}
  .player .stage canvas{height:230px}
  .views .cap .legend{display:none}
}
@media (prefers-reduced-motion:reduce){.award .belt{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="brand" id="home-btn" aria-label="Inicio">
      <svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="var(--blue)"/><path d="M50 2a48 48 0 0 1 0 96a24 24 0 0 1 0-48a24 24 0 0 0 0-48z" fill="var(--red)" transform="rotate(-35 50 50)"/></svg>
      <b>Taegeuk Dojang</b>
    </button>
    <div class="mini-belt" id="mini-belt"></div>
  </header>
  <main id="app"></main>
  <div class="foot">
    <span>Terminología Kukkiwon / World Taekwondo. Colores y detalles de cada poomsae cambian entre escuelas: valida con tu sabeomnim.</span>
    <span id="reset-zone"><button class="linkish" id="reset-btn">Reiniciar progreso</button></span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
/* ============ DATA ============ */
const BELTS=[
 {n:'Blanco',g:'10º Gup',c:'#f7f7f2',m:'Pureza, inicio.'},
 {n:'Blanco punta amarilla',g:'9º Gup',c:'#f7f7f2',t:'#f2c318',m:'La semilla empieza a germinar.'},
 {n:'Amarillo',g:'8º Gup',c:'#f2c318',m:'Germinación: el maíz que crece en la tierra.'},
 {n:'Amarillo punta verde',g:'7º Gup',c:'#f2c318',t:'#2e9a4a',m:'El primer brote asoma sobre la tierra.'},
 {n:'Verde',g:'6º Gup',c:'#2e9a4a',m:'La naturaleza: el vigor de la vida que crece.'},
 {n:'Verde punta azul',g:'5º Gup',c:'#2e9a4a',t:'#1f4fb5',m:'La planta empieza a mirar hacia el cielo.'},
 {n:'Azul',g:'4º Gup',c:'#1f4fb5',m:'El color del cielo: aumento de conocimientos, desarrollo en potencia.'},
 {n:'Azul punta roja',g:'3º Gup',c:'#1f4fb5',t:'#c8102e',m:'La técnica empieza a tener poder real.'},
 {n:'Rojo',g:'2º Gup',c:'#c8102e',m:'El fruto maduro, el atardecer: cerca del fin.'},
 {n:'Rojo punta negra',g:'1º Gup',c:'#c8102e',t:'#111',m:'Último paso antes del Dan.'},
 {n:'Negro',g:'1º Dan',c:'#141414',m:'El carbón duro y sencillo: la unión de todo.'}
];

const KICKS={
 ap_olligi:{ko:'Ap olligi',es:'Patada ascendente frontal',s:'Pierna estirada (elongación)',tip:'La pierna sube recta, sin doblar la rodilla, y baja controlada.'},
 ap:{ko:'Ap chagi',es:'Patada frontal',s:'Ap chuk (base de los dedos)',tip:'Rodilla arriba, extiende, recoge. Dedos tirados hacia atrás.'},
 dollyeo:{ko:'Dollyeo chagi',es:'Patada circular',s:'Baldeung (empeine)',tip:'Gira el pie de apoyo y la cadera; la pierna barre en arco horizontal. La reina del combate WT.'},
 bandal:{ko:'Bandal chagi',es:'Patada media luna',s:'Empeine / ap chuk',tip:'A medio camino entre frontal y circular: sube en diagonal.'},
 yeop:{ko:'Yeop chagi',es:'Patada lateral',s:'Balnal y talón',tip:'Rodilla al pecho, cadera de perfil y empuje en línea recta. El tronco se inclina.'},
 mireo:{ko:'Mireo chagi',es:'Patada de empuje',s:'Balbadak (planta)',tip:'Empuja para sacar al rival de distancia, sin latigazo.'},
 naeryeo:{ko:'Naeryeo chagi',es:'Patada descendente (hacha)',s:'Talón / planta',tip:'Sube la pierna estirada sobre la cabeza del rival y bájala como hacha.'},
 dwit:{ko:'Dwit chagi',es:'Patada hacia atrás',s:'Dwikkumchi (talón)',tip:'Giro, miras por sobre el hombro y disparas recto hacia atrás.'},
 huryeo:{ko:'Huryeo chagi',es:'Patada de gancho',s:'Talón / planta',tip:'Extiendes al costado del objetivo y recoges la pierna como gancho.'},
 pyojeok:{ko:'Pyojeok chagi',es:'Patada al objetivo',s:'Balbadak (planta)',tip:'Golpea la palma de tu propia mano. Aparece en Taegeuk Chil Jang.'},
 narae:{ko:'Narae chagi',es:'Doble circular alternada',s:'Empeine',tip:'Dos dollyeo seguidas cambiando de pierna en el aire.'},
 twieo_ap:{ko:'Twieo ap chagi',es:'Patada frontal en salto',s:'Ap chuk',tip:'La rodilla adelantada sube para impulsar y patea la otra pierna.'},
 dubal:{ko:'Dubal dangseong ap chagi',es:'Doble frontal en salto',s:'Ap chuk',tip:'Dos ap chagi en el mismo salto. Aparece en Taegeuk Pal Jang.'},
 dwi_huryeo:{ko:'Dwi huryeo chagi',es:'Gancho con giro',s:'Talón',tip:'Giro completo y la pierna estirada barre en arco a la altura de la cara.'},
 twieo_yeop:{ko:'Twieo yeop chagi',es:'Lateral en salto',s:'Balnal',tip:'Recoges ambas rodillas en el aire y disparas la lateral.'},
 twieo_dwit:{ko:'Twieo dwit chagi',es:'Patada atrás en salto',s:'Talón',tip:'Saltas girando y sueltas la dwit chagi en el aire.'},
 dolgae:{ko:'Dolgae chagi',es:'Patada tornado',s:'Empeine',tip:'Giro de 360° en el aire que termina en dollyeo chagi.'},
 dubeon_yeop:{ko:'Dubeon yeop chagi',es:'Doble lateral',s:'Balnal',tip:'Dos laterales con la misma pierna, baja y media, sin bajar el pie. Aparece en Koryo.'}
};

function theoryQuestions(lvl,nCur,nPrev){
 const cur=shuffle(LEVELS[lvl].theory||[]).slice(0,nCur), prev=shuffle(LEVELS.slice(0,lvl).flatMap(l=>l.theory||[])).slice(0,nPrev);
 const all=LEVELS.flatMap(l=>l.theory||[]);
 return shuffle([...cur,...prev]).map(t=>{
  const same=shuffle(all.filter(x=>x.cat===t.cat&&x.a!==t.a&&x.q!==t.q).map(x=>x.a)).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3);
  return {type:'theory',q:t.q,sym:t.cat==='simbolo'?t.sym:null,ans:t.a,opts:shuffle([t.a,...same])};});
}

function footprints(fid){

 FORMS[fid].steps.forEach((st,i)=>{
  const v=DV[st.d], perp=[v[1],-v[0]];         // perp apunta a la derecha de quien mira
  let moved=null;
  if(i===0||st.d!==pd||st.lead!==pl){
   moved=st.lead; const other=st.lead==='L'?R:L, len=SLEN[st.s]??1;
   let np;
   if(st.s==='Juchum seogi'){np=[other[0]+perp[0]*(st.lead==='R'?1.1:-1.1),other[1]+perp[1]*(st.lead==='R'?1.1:-1.1)];}
   else if(len===0){np=[other[0]+perp[0]*(st.lead==='R'?.3:-.3),other[1]+perp[1]*(st.lead==='R'?.3:-.3)];}
   else np=[other[0]+v[0]*len,other[1]+v[1]*len];
   if(st.lead==='L')L=np;else R=np;
  }

}

  for(let x=Math.ceil(this.bx[0]);x<=this.bx[1];x++){c.beginPath();c.moveTo(X([x,0]),Y([0,this.by[0]]));c.lineTo(X([x,0]),Y([0,this.by[1]]));c.stroke();}
  for(let y=Math.ceil(this.by[0]);y<=this.by[1];y++){c.beginPath();c.moveTo(X([this.bx[0],0]),Y([0,y]));c.lineTo(X([this.bx[1],0]),Y([0,y]));c.stroke();}
  c.fillStyle=muted;c.font='600 10px "JetBrains Mono",monospace';c.textAlign='center';c.fillText('FRENTE · JUECES',w/2,14);
  // inicio
  c.strokeStyle=muted;c.lineWidth=2;const s0=[X([0,0]),Y([0,0])];c.beginPath();c.moveTo(s0[0]-5,s0[1]-5);c.lineTo(s0[0]+5,s0[1]+5);c.moveTo(s0[0]+5,s0[1]-5);c.lineTo(s0[0]-5,s0[1]+5);c.stroke();
  c.fillText('INICIO',s0[0],s0[1]+18);
  if(this.i<0)return;
  const mid=f=>[(f.L[0]+f.R[0])/2,(f.L[1]+f.R[1])/2];
  // recorrido hasta ahora
  c.strokeStyle=ink;c.globalAlpha=.25;c.lineWidth=2;c.setLineDash([4,4]);c.beginPath();c.moveTo(...s0);
  for(let k=0;k<=this.i;k++){const m=mid(this.fp[k]);c.lineTo(X(m),Y(m));}c.stroke();c.setLineDash([]);c.globalAlpha=1;
  // número de cada paso anterior, en el pie que se movió
  c.font='600 9px "JetBrains Mono",monospace';
  for(let k=0;k<this.i;k++){const f=this.fp[k];if(!f.moved)continue;const p=f[f.moved];c.globalAlpha=.35;c.fillStyle=col[f.moved];c.beginPath();c.arc(X(p),Y(p),7,0,7);c.fill();c.globalAlpha=1;c.fillStyle=css('--surface');c.fillText(k+1,X(p),Y(p)+3);}
  // pies actuales (el que se movió entra animado)
  const f=this.cur,e=ease(this.p),pr=this.prev;
  const pos=s=>{const a=pr[s],b=f[s];return[a[0]+(b[0]-a[0])*e,a[1]+(b[1]-a[1])*e];};
  const ang={N:0,E:90,S:180,W:270}[f.d];
  const foot=(s)=>{const p=pos(s),v=DV[f.d],perp=[v[1],-v[0]],off=f.s==='Juchum seogi'||SLEN[f.s]===0?0:.13*(s==='R'?1:-1);
   const q=[p[0]+perp[0]*off,p[1]+perp[1]*off];c.save();c.translate(X(q),Y(q));c.rotate(rad(ang));c.fillStyle=col[s];
   c.beginPath();c.ellipse(0,-2,sc*.1,sc*.2,0,0,7);c.fill();c.beginPath();c.ellipse(0,-sc*.24,sc*.08,sc*.06,0,0,7);c.fill();c.restore();};
  foot('L');foot('R');
  // flecha de mirada
  const m=[(pos('L')[0]+pos('R')[0])/2,(pos('L')[1]+pos('R')[1])/2],v=DV[f.d],tip=[m[0]+v[0]*.75,m[1]+v[1]*.75];
  c.strokeStyle=ink;c.fillStyle=ink;c.lineWidth=2.5;c.beginPath();c.moveTo(X(m),Y(m));c.lineTo(X(tip),Y(tip));c.stroke();
  c.save();c.translate(X(tip),Y(tip));c.rotate(rad(ang));c.beginPath();c.moveTo(0,-7);c.lineTo(6,3);c.lineTo(-6,3);c.closePath();c.fill();c.restore();
 }
}

  const keys=new Set([skey(st)]), opts=[st];
  const add=x=>{if(x&&opts.length<4&&!keys.has(skey(x))){keys.add(skey(x));opts.push(x);}};
  add({...st,lead:oth(st.lead)});                                   // mismo movimiento, lado contrario
  shuffle(fm.steps).forEach(x=>{if(opts.length<3)add(x)});            // otro paso de la misma forma
  add({...st,s:shuffle(stances.filter(s=>s!==st.s))[0]});            // otra posición
  shuffle(allSteps).forEach(add);
  const sh=shuffle(opts.map(o=>({...o,d:st.d,pos:st.pos})));
  return {type:'form',fid,k,st,opts:sh,ai:sh.findIndex(o=>skey(o)===skey(st))};
 });
}
function kickQuestions(lvl,n){
 const L=LEVELS[lvl],prev=shuffle(LEVELS.slice(0,lvl).flatMap(l=>l.kicks)).slice(0,n);
 const known=LEVELS.slice(0,lvl+1).flatMap(l=>l.kicks);
 return shuffle([...L.kicks,...prev]).map((id,i)=>{
  const others=shuffle(Object.keys(KICKS).filter(k=>k!==id)).sort((a,b)=>(known.includes(b)?1:0)-(known.includes(a)?1:0));
  const opts=shuffle([id,...others.slice(0,3)]);
  return {type:'kick',mode:(lvl>=4&&i%2)?'name':'pick',id,opts,ai:opts.indexOf(id)};});
}
function vocabQuestions(lvl,nCur,nPrev){
 const cur=shuffle(LEVELS[lvl].vocab).slice(0,nCur), prev=shuffle(LEVELS.slice(0,lvl).flatMap(l=>l.vocab)).slice(0,nPrev);
 const pool=LEVELS.slice(0,lvl+1).flatMap(l=>l.vocab);
 return shuffle([...cur,...prev]).map(v=>{const rev=Math.random()<.35;
  const others=shuffle(pool.filter(x=>x.ko!==v.ko&&x.es!==v.es)).slice(0,3);
  return rev?{type:'vocab',rev,q:v.es,ans:v.ko,opts:shuffle([v.ko,...others.map(o=>o.ko)])}:{type:'vocab',rev,q:v.ko,ans:v.es,opts:shuffle([v.es,...others.map(o=>o.es)])};});
}
function startExam(lvl,{practice=null,formId=null}){
 const L=LEVELS[lvl];let qs=[],picked=[];
 if(!practice||practice==='form'){
  if(practice==='form')picked=[formId];
  else if(L.review){const r=TAEGEUKS[Math.random()*8|0];picked=L.forms[0]==='koryo'?['koryo',r]:[r];}
  else picked=[L.forms[0]];
  picked.forEach(f=>qs.push(...formQuestions(f)));
 }
 if(!practice||practice==='kicks')qs.push(...kickQuestions(lvl,practice?4:2));
 if(!practice||practice==='vocab')qs.push(...vocabQuestions(lvl,practice?10:6,practice?4:2));
 if(!practice||practice==='theory')qs.push(...theoryQuestions(lvl,practice?10:5,practice?4:2));
 S.exam={lvl,practice,picked,qs,i:0,res:[],locked:false};
 go('exam');
}
function figOptions(n,label){return `<div class="figs">${Array.from({length:n},(_,j)=>`<button class="figopt opt" data-j="${j}" aria-label="Opción ${LETTERS[j]}"><span class="lt">${LETTERS[j]}</span><canvas></canvas><span class="nm" data-nm="${j}">${label?esc(label(j)):'&nbsp;'}</span></button>`).join('')}</div>`;}
function renderExam(){
 const E=S.exam,q=E.qs[E.i],n=E.qs.length,belt=BELTS[E.lvl];
 const sec=q.type==='form'?`Parte 1 · ${FORMS[q.fid].ko}`:q.type==='kick'?'Parte 2 · Patadas':q.type==='theory'?'Parte 4 · Teoría':'Parte 3 · Vocabulario';
 app.innerHTML=`
 <div class="exam-top"><div><div class="eyebrow">${E.practice?'Práctica':'Examen'} · ${esc(belt.n)} → ${esc(BELTS[E.lvl+1].n)}</div><h2 style="font-size:24px;margin-top:4px">${esc(sec)}</h2></div>
  <div class="row"><span class="muted" style="font-family:var(--mono);font-size:13px">${E.i+1}/${n}</span><span id="quitz"><button class="btn ghost" id="quit">Salir</button></span></div></div>
 <div class="bar"><i style="width:${E.i/n*100}%"></i></div>
 <div id="qbody"></div>`;
 const body=document.getElementById('qbody');
 if(q.type==='form'){
  const fm=FORMS[q.fid], prev=q.k>0?fm.steps[q.k-1]:null, startPose=prev?stepFrames(prev).end:junbiPose(q.st.d);
  const fq=E.qs.map((x,j)=>({x,j})).filter(o=>o.x.type==='form'&&o.x.fid===q.fid);
  body.innerHTML=`<div class="q wide"><div>
   <div class="eyebrow">Paso ${q.k+1} de ${fm.steps.length}</div>
   <div class="prompt">¿Cuál es el siguiente movimiento?</div>
   <p class="muted" style="margin:6px 0 12px">Te giras <b>${DIRS[q.st.d].l.toLowerCase()}</b>. Fíjate en el pie que queda adelante y en el brazo que trabaja.</p>
   <div class="views"><div class="stage ref"><canvas id="ref-cv"></canvas><div class="cap"><div class="eyebrow">${prev?`Paso ${q.k}`:`Junbi${q.fid==='koryo'?' · Tongmilgi':''}`}</div></div></div><div class="stage ref"><canvas id="refair-cv"></canvas><div class="cap" style="top:auto;bottom:8px"><div class="eyebrow">Desde arriba</div></div></div></div>
   <div class="legend" style="margin-top:10px"><span class="side R">Derecha</span><span class="side L">Izquierda</span></div>
   <div class="trail">${fq.map(o=>{const r=E.res[o.j];return `<span class="${r===undefined?(o.j===E.i?'cur':''):r?'ok':'bad'}">${o.x.k+1}</span>`}).join('')}</div>
  </div><div>${figOptions(q.opts.length)}</div></div>`;
  new Fig(document.getElementById('ref-cv'),{belt,pose:startPose,view:'detras',start:true});
  {const a=new Aerial(document.getElementById('refair-cv'),q.fid);a.go(q.k-1);a.p=1;a.t0=-1e9;}
  body.querySelectorAll('.figopt canvas').forEach((cv,j)=>{const f=new Fig(cv,{belt,pose:startPose,view:'detras',start:true,zoom:.78});f.play(stepFrames(q.opts[j]).frames,{loop:true,start:startPose});});
 }else if(q.type==='kick'&&q.mode==='pick'){
  body.innerHTML=`<div class="q wide"><div>
   <div class="eyebrow">Elige la figura</div>
   <div class="prompt">${esc(KICKS[q.id].ko)}</div>
   <p class="muted" style="margin:6px 0">${esc(KICKS[q.id].es)}</p>
  </div><div>${figOptions(4)}</div></div>`;
  body.querySelectorAll('.figopt canvas').forEach((cv,j)=>new Fig(cv,{belt,target:true,zoom:.85}).kick(q.opts[j]));
 }else if(q.type==='kick'){
  body.innerHTML=`<div class="q"><div class="stage"><canvas id="ex-cv"></canvas><div class="cap"><div class="eyebrow">Mira la animación</div></div></div><div>
   <div class="prompt">¿Qué patada es?</div>
   <div class="opts">${q.opts.map((o,j)=>`<button class="opt" data-j="${j}"><span class="ko">${esc(KICKS[o].ko)}</span><br><span class="muted" style="font-size:13px">${esc(KICKS[o].es)}</span></button>`).join('')}</div></div></div>`;
  new Fig(document.getElementById('ex-cv'),{belt,target:true}).kick(q.id);
 }else if(q.type==='theory'){
  body.innerHTML=`<div class="q solo"><div><div class="eyebrow">Teoría</div>
   ${q.sym?`<div class="symbig">${q.sym}</div>`:''}
   <div class="prompt" style="font-size:clamp(22px,3.4vw,32px)">${esc(q.q)}</div>
   <div class="opts">${q.opts.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join('')}</div></div></div>`;
 }else{
  body.innerHTML=`<div class="q solo"><div><div class="eyebrow">${q.rev?'¿Cómo se dice en coreano?':'¿Qué significa?'}</div>
   <div class="prompt">${esc(q.q)}</div>
   <div class="opts">${q.opts.map((o,j)=>`<button class="opt" data-j="${j}">${q.rev?`<span class="ko">${esc(o)}</span>`:esc(o)}</button>`).join('')}</div></div></div>`;
 }
 document.getElementById('quit').onclick=()=>{document.getElementById('quitz').innerHTML=`<span class="confirm"><span class="muted" style="font-size:13px">¿Salir sin terminar?</span><button class="btn red" id="qy">Salir</button><button class="btn ghost" id="qn">Seguir</button></span>`;
  document.getElementById('qy').onclick=()=>go('level',{lvl:E.lvl,tab:E.practice?({form:'forma',kicks:'patadas',vocab:'vocab',theory:'teoria'}[E.practice]):'examen'});document.getElementById('qn').onclick=renderExam;};
 body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.j));
}
function answer(j){
 const E=S.exam,q=E.qs[E.i];if(E.locked)return;E.locked=true;
 const ai=q.ai??q.opts.indexOf(q.ans), ok=j===ai;E.res[E.i]=ok;
 document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===ai)b.classList.add('right');else if(k===j)b.classList.add('wrong');});
 // revela los nombres bajo cada figura
 document.querySelectorAll('[data-nm]').forEach(el=>{const o=q.opts[+el.dataset.nm];
  el.innerHTML=q.type==='form'?`${esc(o.t.join(' → '))} <span class="muted">· ${esc(o.s)}</span> <span class="side ${o.lead}">pie ${o.lead==='L'?'izq.':'der.'}</span>`:`<span class="ko">${esc(KICKS[o].ko)}</span> <span class="muted">· ${esc(KICKS[o].es)}</span>`;});
 const wait=q.type==='vocab'||q.type==='theory'||q.mode==='name'?(ok?700:1700):(ok?1600:3200);
 setTimeout(()=>{E.locked=false;E.i++;if(E.i>=E.qs.length)finishExam();else renderExam();},wait);
}
function finishExam(){
 const E=S.exam,parts={form:[0,0],kick:[0,0],vocab:[0,0],theory:[0,0]},miss=[];
 E.qs.forEach((q,k)=>{parts[q.type][1]++;if(E.res[k])parts[q.type][0]++;else miss.push(q);});
 const tot=E.res.filter(Boolean).length,pct=Math.round(tot/E.qs.length*100),formErr=parts.form[1]-parts.form[0];
 const passed=pct>=80&&formErr<=2;
 let promoted=false;
 if(!E.practice){const h=S.hist[E.lvl]||{best:0,passed:false};h.best=Math.max(h.best,pct);h.passed=h.passed||passed;S.hist[E.lvl]=h;store.set('tkd-hist',S.hist);
  if(passed&&E.lvl===S.belt){S.belt=E.lvl+1;store.set('tkd-belt',S.belt);promoted=true;renderMini();}}
 const to=BELTS[E.lvl+1];
 const missTxt=q=>q.type==='form'?`${FORMS[q.fid].ko}, paso ${q.k+1}: ${stepLabel(q.st)} (pie ${q.st.lead==='L'?'izquierdo':'derecho'} adelante)`:q.type==='kick'?`${KICKS[q.id].es}: ${KICKS[q.id].ko}`:`${q.q} → ${q.ans}`;
 const sc=(l,p)=>p[1]?`<div class="score"><span class="eyebrow">${l}</span><b>${p[0]}/${p[1]}</b></div>`:'';
 app.innerHTML=`<div class="result">
  <div class="eyebrow">${E.practice?'Resultado de práctica':'Resultado del examen'}</div>
  <h1>${E.practice?`${pct}% correcto`:passed?`¡Cinturón ${esc(to.n)}!`:'Todavía no'}</h1>
  ${!E.practice&&passed?`<div class="award">${beltHTML(to,true)}</div><p>${esc(to.g)}. ${esc(to.m)} ${promoted?'Se desbloqueó tu siguiente grado.':''}</p>`:''}
  ${!E.practice&&!passed?`<p>Sacaste <b>${pct}%</b>${parts.form[1]?` con <b>${formErr}</b> error${formErr===1?'':'es'} en el poomsae`:''}. Necesitas 80% y máximo 2 errores en la forma. Repasa lo de abajo y vuelve a intentarlo.</p>`:''}
  <div class="scores">${sc('Poomsae',parts.form)}${sc('Patadas',parts.kick)}${sc('Vocabulario',parts.vocab)}${sc('Teoría',parts.theory)}</div>
  ${E.picked.length&&!E.practice&&LEVELS[E.lvl].review?`<p class="muted">El examinador eligió: ${E.picked.map(f=>FORMS[f].ko).join(' y ')}.</p>`:''}
  ${miss.length?`<div class="eyebrow" style="margin-top:8px">Para repasar</div><ul class="miss">${miss.map(q=>`<li>${esc(missTxt(q))}</li>`).join('')}</ul>`:'<p>Sin errores. Limpio.</p>'}
  <div class="row" style="margin-top:22px">
   ${promoted&&S.belt<10?`<button class="btn red" id="r-next">Empezar ${esc(BELTS[S.belt].n)} → ${esc(BELTS[S.belt+1].n)}</button>`:''}
   <button class="btn ${promoted?'ghost':'red'}" id="r-again">${E.practice?'Practicar de nuevo':'Volver a rendir'}</button>
   <button class="btn ghost" id="r-home">Escalera de cinturones</button>
  </div></div>`;
 const n=document.getElementById('r-next');if(n)n.onclick=()=>go('level',{lvl:S.belt,tab:'forma',form:null,step:0,kick:null});
 document.getElementById('r-again').onclick=()=>startExam(E.lvl,{practice:E.practice,formId:E.picked[0]});
 document.getElementById('r-home').onclick=()=>go('home');
}

/* ============ BOOT ============ */
function render(){renderMini();({home:renderHome,level:renderLevel,exam:renderExam})[S.screen]();}
document.getElementById('home-btn').onclick=()=>go('home');
document.getElementById('reset-btn').onclick=function(){const z=document.getElementById('reset-zone');z.innerHTML=`<span class="confirm">¿Volver a cinturón blanco? <button class="linkish" id="ry">Sí, reiniciar</button> <button class="linkish" id="rn">Cancelar</button></span>`;
 document.getElementById('ry').onclick=()=>{S.belt=0;S.hist={};store.set('tkd-belt',0);store.set('tkd-hist',{});location.reload();};
 document.getElementById('rn').onclick=()=>{z.innerHTML='<button class="linkish" id="reset-btn">Reiniciar progreso</button>';document.getElementById('reset-btn').onclick=arguments.callee;};};
render();
</script>
